<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sw3-dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2430"/>
      <stop offset="45%" stop-color="#2e3e50"/>
      <stop offset="100%" stop-color="#0e1820"/>
    </linearGradient>
    <radialGradient id="sw3-glow" cx="35%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#c0a060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a2430" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sw3-dusk)"/>
  <rect width="1920" height="1080" fill="url(#sw3-glow)"/>

  <!-- Harbour structures  dark silhouettes -->
  <!-- Pier -->
  <rect x="200" y="560" width="600" height="20" fill="#0c1420"/>
  <rect x="180" y="580" width="640" height="8" fill="#0e1822"/>

  <!-- Pier posts -->
  <rect x="240" y="580" width="12" height="120" fill="#0a1018"/>
  <rect x="360" y="580" width="12" height="140" fill="#0a1018"/>
  <rect x="480" y="580" width="12" height="130" fill="#0a1018"/>
  <rect x="600" y="580" width="12" height="115" fill="#0a1018"/>
  <rect x="720" y="580" width="12" height="125" fill="#0a1018"/>

  <!-- Boats at dock -->
  <rect x="250" y="540" width="180" height="22" fill="#10181e" rx="2"/>
  <rect x="460" y="545" width="220" height="18" fill="#0e1620" rx="2"/>
  <!-- Mast -->
  <line x1="340" y1="562" x2="340" y2="460" stroke="#0e1820" stroke-width="3"/>
  <line x1="565" y1="563" x2="565" y2="448" stroke="#0e1820" stroke-width="3"/>

  <!-- Harbour light  warm amber point -->
  <circle cx="660" cy="520" r="8" fill="#d0a040" opacity="0.7"/>
  <circle cx="660" cy="520" r="30" fill="#c09030" opacity="0.15"/>
  <!-- Reflection on water -->
  <line x1="660" y1="560" x2="652" y2="680" stroke="#c09030" stroke-width="3" opacity="0.25"/>
  <line x1="668" y1="568" x2="668" y2="660" stroke="#c09030" stroke-width="1" opacity="0.15"/>

  <!-- Distant town lights  scattered small points -->
  <circle cx="980" cy="490" r="2.5" fill="#d0b870" opacity="0.55"/>
  <circle cx="1050" cy="480" r="2" fill="#c8b060" opacity="0.45"/>
  <circle cx="1130" cy="495" r="2.5" fill="#d0b870" opacity="0.5"/>
  <circle cx="1200" cy="475" r="2" fill="#c0a850" opacity="0.4"/>
  <circle cx="1280" cy="490" r="2" fill="#d0b870" opacity="0.48"/>
  <circle cx="1350" cy="482" r="3" fill="#c8b060" opacity="0.5"/>
  <circle cx="1440" cy="497" r="2" fill="#d0b870" opacity="0.42"/>

  <!-- Water surface -->
  <rect x="0" y="600" width="1920" height="480" fill="#0c1820" opacity="0.7"/>
  <line x1="0" y1="600" x2="1920" y2="600" stroke="#1e2e40" stroke-width="1" opacity="0.5"/>

  <!-- Caption -->
  <text x="60" y="1044" font-family="'Courier New', monospace" font-size="16" fill="#f8f8f7" opacity="0.2" letter-spacing="3">still water  still 03  harbour at dusk</text>
</svg>
